name: Docker Release Fork

on:
  push:
    tags:
      - "v*"
      - "!v*-alpha.*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - ".agents/**"
      - "skills/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable or beta release tag to backfill (for example v2026.3.22 or v2026.3.22-beta.1)
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('docker-release-fork-manual-{0}', inputs.tag) || format('docker-release-fork-push-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: openclaw/openclaw
  # Custom build-args: set these in your fork's repository variables or secrets,
  # or override via workflow_dispatch environment.
  OPENCLAW_DOCKER_APT_PACKAGES: ${{ vars.OPENCLAW_DOCKER_APT_PACKAGES || '' }}
  OPENCLAW_EXTENSIONS: ${{ vars.OPENCLAW_EXTENSIONS || 'diagnostics-otel,codex' }}
  OPENCLAW_INSTALL_DOCKER_CLI: ${{ vars.OPENCLAW_INSTALL_DOCKER_CLI || '' }}
  OPENCLAW_INSTALL_BROWSER: ${{ vars.OPENCLAW_INSTALL_BROWSER || '' }}

jobs:
  resolve_build_provenance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      built_at: ${{ steps.build_provenance.outputs.built_at }}
      source_sha: ${{ steps.build_provenance.outputs.source_sha }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0

      - name: Resolve shared build provenance
        id: build_provenance
        shell: bash
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: [resolve_build_provenance]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve_build_provenance.outputs.source_sha }}
          fetch-depth: 0

      - name: Pre-pull BuildKit image
        shell: bash
        env:
          BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if docker pull "${BUILDKIT_IMAGE}"; then
              exit 0
            fi
            if [[ "${attempt}" == "4" ]]; then
              echo "::error::Failed to pull ${BUILDKIT_IMAGE} after ${attempt} attempts"
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "BuildKit image pull failed; retrying in ${sleep_seconds}s (${attempt}/4)."
            sleep "${sleep_seconds}"
          done

      - name: Set up Docker Builder
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags (amd64)
        id: tags
        shell: bash
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
        run: |
          set -euo pipefail
          tags=()
          if [[ "${SOURCE_REF}" == refs/tags/v* ]]; then
            version="${SOURCE_REF#refs/tags/v}"
            tags+=("${GHCR_IMAGE}:${version}-amd64")
            tags+=("${GHCR_IMAGE}:${version}-slim-amd64")
          fi
          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "::error::No amd64 tags resolved for ref ${SOURCE_REF}"
            exit 1
          fi
          {
            echo "value<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve OCI labels (amd64)
        id: labels
        shell: bash
        env:
          BUILD_TIMESTAMP: ${{ needs.resolve_build_provenance.outputs.built_at }}
          SOURCE_SHA: ${{ needs.resolve_build_provenance.outputs.source_sha }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
        run: |
          set -euo pipefail
          source_sha="${SOURCE_SHA}"
          version="${source_sha}"
          if [[ "${SOURCE_REF}" == refs/tags/v* ]]; then
            version="${SOURCE_REF#refs/tags/v}"
          fi
          created="${BUILD_TIMESTAMP}"
          {
            echo "value<<EOF"
            echo "org.opencontainers.image.revision=${source_sha}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.created=${created}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          cache-from: type=gha,scope=docker-release-custom-amd64
          cache-to: type=gha,mode=max,scope=docker-release-custom-amd64
          build-args: |
            GIT_COMMIT=${{ needs.resolve_build_provenance.outputs.source_sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ needs.resolve_build_provenance.outputs.built_at }}
            OPENCLAW_EXTENSIONS=${{ env.OPENCLAW_EXTENSIONS }}
            OPENCLAW_DOCKER_APT_PACKAGES=${{ env.OPENCLAW_DOCKER_APT_PACKAGES }}
            OPENCLAW_INSTALL_DOCKER_CLI=${{ env.OPENCLAW_INSTALL_DOCKER_CLI }}
            OPENCLAW_INSTALL_BROWSER=${{ env.OPENCLAW_INSTALL_BROWSER }}
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ steps.labels.outputs.value }}
          sbom: true
          provenance: mode=max
          push: true

  build-arm64:
    needs: [resolve_build_provenance]
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve_build_provenance.outputs.source_sha }}
          fetch-depth: 0

      - name: Pre-pull BuildKit image
        shell: bash
        env:
          BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if docker pull "${BUILDKIT_IMAGE}"; then
              exit 0
            fi
            if [[ "${attempt}" == "4" ]]; then
              echo "::error::Failed to pull ${BUILDKIT_IMAGE} after ${attempt} attempts"
              exit 1
            fi
            sleep_seconds=$((attempt * 10))
            echo "BuildKit image pull failed; retrying in ${sleep_seconds}s (${attempt}/4)."
            sleep "${sleep_seconds}"
          done

      - name: Set up Docker Builder
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags (arm64)
        id: tags
        shell: bash
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
        run: |
          set -euo pipefail
          tags=()
          if [[ "${SOURCE_REF}" == refs/tags/v* ]]; then
            version="${SOURCE_REF#refs/tags/v}"
            tags+=("${GHCR_IMAGE}:${version}-arm64")
            tags+=("${GHCR_IMAGE}:${version}-slim-arm64")
          fi
          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "::error::No arm64 tags resolved for ref ${SOURCE_REF}"
            exit 1
          fi
          {
            echo "value<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve OCI labels (arm64)
        id: labels
        shell: bash
        env:
          BUILD_TIMESTAMP: ${{ needs.resolve_build_provenance.outputs.built_at }}
          SOURCE_SHA: ${{ needs.resolve_build_provenance.outputs.source_sha }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
        run: |
          set -euo pipefail
          source_sha="${SOURCE_SHA}"
          version="${source_sha}"
          if [[ "${SOURCE_REF}" == refs/tags/v* ]]; then
            version="${SOURCE_REF#refs/tags/v}"
          fi
          created="${BUILD_TIMESTAMP}"
          {
            echo "value<<EOF"
            echo "org.opencontainers.image.revision=${source_sha}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.created=${created}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push arm64 image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/arm64
          cache-from: type=gha,scope=docker-release-custom-arm64
          cache-to: type=gha,mode=max,scope=docker-release-custom-arm64
          build-args: |
            GIT_COMMIT=${{ needs.resolve_build_provenance.outputs.source_sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ needs.resolve_build_provenance.outputs.built_at }}
            OPENCLAW_EXTENSIONS=${{ env.OPENCLAW_EXTENSIONS }}
            OPENCLAW_DOCKER_APT_PACKAGES=${{ env.OPENCLAW_DOCKER_APT_PACKAGES }}
            OPENCLAW_INSTALL_DOCKER_CLI=${{ env.OPENCLAW_INSTALL_DOCKER_CLI }}
            OPENCLAW_INSTALL_BROWSER=${{ env.OPENCLAW_INSTALL_BROWSER }}
          tags: ${{ steps.tags.outputs.value }}
          labels: ${{ steps.labels.outputs.value }}
          sbom: true
          provenance: mode=max
          push: true

  create-manifest:
    needs: [resolve_build_provenance, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.resolve_build_provenance.outputs.source_sha }}
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve manifest tags
        id: tags
        shell: bash
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
        run: |
          set -euo pipefail
          tags=()
          if [[ "${SOURCE_REF}" == refs/tags/v* ]]; then
            version="${SOURCE_REF#refs/tags/v}"
            tags+=("${GHCR_IMAGE}:${version}")
            tags+=("${GHCR_IMAGE}:${version}-slim")
            tags+=("${GHCR_IMAGE}:latest")
          fi
          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "::error::No manifest tags resolved for ref ${SOURCE_REF}"
            exit 1
          fi
          {
            echo "value<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        shell: bash
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          TAGS: ${{ steps.tags.outputs.value }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          mapfile -t tags <<< "${TAGS}"
          create_manifest() {
            local amd64_digest="$1"
            local arm64_digest="$2"
            shift 2
            local args=()
            for tag in "$@"; do
              [ -z "$tag" ] && continue
              args+=("-t" "$tag")
            done
            docker buildx imagetools create "${args[@]}" "$amd64_digest" "$arm64_digest"
          }
          create_manifest "${AMD64_DIGEST}" "${ARM64_DIGEST}" "${tags[@]}"
